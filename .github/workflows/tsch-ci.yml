name: tsch-ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_USER: tsch
          POSTGRES_PASSWORD: tsch
          POSTGRES_DB: tsch_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tsch" --health-interval 5s --health-retries 20
    env:
      TSCH_TEST_DATABASE_URL: postgresql+psycopg://tsch:tsch@localhost:5432/tsch_test
      TSCH_DATABASE_URL: postgresql+psycopg://tsch:tsch@localhost:5432/tsch_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
      - run: uv python install 3.12
      - run: uv sync --frozen --python 3.12
      - name: Lint
        run: uv run ruff check .
      - name: Type check (strict)
        run: uv run mypy
      - name: Tests (SQLite + PostgreSQL)
        run: uv run pytest -q
      - name: Migration round-trip and drift check
        working-directory: services/api
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
          uv run alembic check
      - name: OpenAPI contract is current
        run: |
          uv run tsch-export-openapi /tmp/openapi.json
          diff -u packages/contracts/openapi.json /tmp/openapi.json

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  compose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: |
          mkdir -p secrets && echo ci > secrets/db_password && echo ci > secrets/operator_token
          docker compose -f infra/docker/docker-compose.yml config -q
