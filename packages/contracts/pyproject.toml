[project]
name = "tsch-contracts"
version = "0.1.0"
description = "Shared domain contracts: broker adapter protocol, models, order state machine"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tsch_contracts"]
