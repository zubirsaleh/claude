[project]
name = "tsch-worker"
version = "0.1.0"
description = "TSCH background worker (Phase 1: heartbeat only)"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28"]

[project.scripts]
tsch-worker = "tsch_worker.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tsch_worker"]
