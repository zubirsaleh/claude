[project]
name = "tsch-api"
version = "0.1.0"
description = "TSCH FastAPI backend"
requires-python = ">=3.12"
dependencies = [
  "tsch-contracts", "tsch-risk",
  "fastapi>=0.115", "uvicorn[standard]>=0.32", "sqlalchemy>=2.0.36",
  "alembic>=1.14", "psycopg[binary]>=3.2", "pydantic-settings>=2.6", "httpx>=0.28",
]

[project.scripts]
tsch-export-openapi = "tsch_api.openapi_export:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tsch_api"]
